- iommu_guest_live_migration:
    type = local_migration_with_mlnx
    start_vm = no
    only Linux
    only x86_64
    only HostCpuVendor.amd
    pcie_extra_root_port = 0
    vt_ulimit_nofile = 65536
    usb_devices = ""
    auto_cpu_model = "no"
    cpu_model = "host"
    machine_type = "q35"
    machine_type_extra_params = "kernel-irqchip=split"
    extra_params = " -global kvm-pit.lost_tick_policy=discard"
    vcpu_sockets = 1
    vcpu_dies = 1
    vcpu_threads = 1
    mem = 16G
    variants:
        - iommu_dirty_tracking:
            required_qemu = [9.1.0,)
            iommu_dirty_tracking = "yes"
        - device_dirty_tracking:
            iommu_dirty_tracking = "no"
    variants:
        - without_passthrough:
            pci_device = ""
        - with_passthrough:
            # Update pci_device with host PCI device/s for passthrough to the guest
            # enabling host IOMMU functionality validation.
            #pci_device = ""
    variants:
        - vcpu_512:
            smp_fixed = 512
            vcpu_maxcpus = 512
            vcpu_cores = 512
        - vcpu_288:
            smp_fixed = 288
            vcpu_maxcpus = 288
            vcpu_cores = 288
        - vcpu_256:
            smp_fixed = 256
            vcpu_maxcpus = 256
            vcpu_cores = 256
        - vcpu_254:
            smp_fixed = 254
            vcpu_maxcpus = 254
            vcpu_cores = 254
        - vcpu_128:
            smp_fixed = 128
            vcpu_maxcpus = 128
            vcpu_cores = 128
        - vcpu_64:
            smp_fixed = 64
            vcpu_maxcpus = 64
            vcpu_cores = 64
    variants:
        - ext_apic_id:
            cpu_model_flags += ",kvm-msi-ext-dest-id=on"
        - emul_intel_iommu:
            intel_iommu = yes
            iommu_eim = on
            iommu_intremap = on
            guest_iommu_option = pt
            iommu_caching_mode = on
            no with_passthrough
        - emul_amd_iommu:
            extra_params += " -device AMDVI-PCI,id=iommupci0,bus=pcie.0,addr=0x05"
            extra_params += " -device amd-iommu,dma-remap=on,intremap=on,xtsup=on,pci-id=iommupci0"
            no with_passthrough
            required_qemu = [10.1.0,)
    variants:
        - avic:
            mode = "apic"
            cpu_model_flags += ",-x2apic"
            kvm_probe_module_parameters = "avic=1"
            no vcpu_512, vcpu_288, vcpu_256
        - x2avic:
            mode = "x2apic"
            cpu_model_flags += ",+x2apic"
            kvm_probe_module_parameters = "avic=1"
        - apic:
            mode = "apic"
            cpu_model_flags += ",-x2apic"
            kvm_probe_module_parameters = "avic=0"
            no vcpu_512, vcpu_288, vcpu_256
        - x2apic:
            mode = "x2apic"
            cpu_model_flags += ",+x2apic"
            kvm_probe_module_parameters = "avic=0"
