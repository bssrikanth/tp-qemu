- amd_svsm:
    type = amd_svsm
    only Linux
    kill_vm = yes
    login_timeout = 240
    start_vm = no
    image_snapshot = yes
    mem = 8192
    vm_mem_backend = memory-backend-memfd
    smp = 8
    virtio_dev_iommu_platform = on
    virtio_dev_disable_legacy = on
    machine_type_extra_params = "kernel-irqchip=split,device-plane=2"
    module_status = Y y 1
    enable_igvm = yes
    igvm_path = /usr/share/coconut-svsm
    igvm_filename = coconut-qemu.igvm
    svsm_vtpm_serial_markers_sep = ";"
    svsm_vtpm_serial_markers = "[SVSM] VTPM: TPM 2.0 Reference Implementation initialized;Found SVSM vTPM;TPM2Startup: TPM_RC_SUCCESS"
    svsm_vtpm_run_tpm2_tools = yes
    svsm_vtpm_install_tpm2_tools = yes
    svsm_vtpm_tpm2_tools_pkg = tpm2-tools
    svsm_vtpm_tpm2_tools_install_timeout = 600
    svsm_vtpm_require_tpm2_tools = no
    svsm_vtpm_pcr0_must_be_extended = yes
    svsm_vtpm_kernel_driver_name = tpm-svsm
    svsm_run_snp_attestation = yes
    svsm_snp_attestation_timeout = 900
    svsm_snpguest_build_timeout = 1200
    svsm_snp_attestation_vmpl = 2
    svsm_snp_attestation_platform =
    svsm_expected_measurement =
    svsm_snp_attestation_measurement_tool =
    svsm_snp_attestation_measurement_tool_args =
    svsm_snp_attestation_measurement_timeout = 60
    guest_dir = /home
    attestation_script = regular_attestation_workflow.sh
    snpguest_install_script = snpguest_install.sh
    guest_cmd = ${guest_dir}/${attestation_script}
    host_script = sev-snp/${attestation_script}
    snpguest_sourcebuild = 1
    snpguest_buildcmd = ${guest_dir}/${snpguest_install_script}
    snpguest_buildcmd_args = "--repo https://github.com/virtee/snpguest.git"
    snpguest_build_location = sev-snp/${snpguest_install_script}
    guest_tool_install = "dnf install -y snpguest"
    vm_secure_guest_type = snp
    required_qemu = [9.1.0, )
    vm_sev_cbitpos = 51
    vm_sev_reduced_phys_bits = 1
    cvm_module_path = "/sys/module/kvm_amd/parameters/sev_snp"
    vm_sev_policy = 196608
