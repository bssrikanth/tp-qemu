- snp_attestation:
    type = snp_basic_config
    only Linux
    only HostCpuVendor.amd
    kill_vm = yes
    login_timeout = 240
    start_vm = no
    image_snapshot = yes
    mem = 8192
    smp = 8
    required_qemu = [9.1.0, )
    vm_secure_guest_type = snp
    vm_sev_reduced_phys_bits = 1
    virtio_dev_disable_legacy = on
    vm_mem_backend = memory-backend-memfd
    bios_path =  /usr/share/edk2/ovmf/OVMF.amdsev.fd
    snp_module_path = "/sys/module/kvm_amd/parameters/sev_snp"
    module_status = Y y 1
    snp_guest_check = "journalctl|grep -i -w snp"
    guest_tool_install = "dnf install -y snpguest"
    snpguest_sourcebuild = 1
    attestation_script = regular_attestation_workflow.sh
    snpguest_install_script = snpguest_install.sh
    guest_dir = /home
    guest_cmd = ${guest_dir}/${attestation_script}
    host_script = sev-snp/${attestation_script}
    snpguest_buildcmd = ${guest_dir}/${snpguest_install_script}
    snpguest_buildcmd_args = "--repo https://github.com/virtee/snpguest.git"
    snpguest_build_location = sev-snp/${snpguest_install_script}
    snp_measurement_required = no
    snp_attestation_measurement_tool =
    snp_attestation_measurement_tool_args =
    snp_attestation_measurement_timeout = 60
    snp_measure_autoinstall = yes
    snp_measure_install_script = sev-snp/sev_snp_measure_install.sh
    snp_measure_install_repo = https://github.com/virtee/sev-snp-measure.git
    snp_measure_install_tag =
    snp_measure_install_branch = main
    snp_measure_install_timeout = 600
    snp_measure_install_args =
    snp_measure_vcpu_type =
    snp_measure_ovmf =
    snp_measure_guest_features =
    snp_measure_kernel =
    snp_measure_initrd =
    snp_measure_append =
    variants:
        - policy_default:
            vm_sev_policy = 0x30000
            snp_expected_measurement =
        - policy_debug:
            vm_sev_policy = 0xB0000
            snp_expected_measurement =
        - policy_singlesocket:
            single_socket = True
            vm_sev_policy = 0x130000
            snp_expected_measurement =
        - policy_singlesocket_debug:
            single_socket = True
            vm_sev_policy = 0x1B0000
            snp_expected_measurement =
